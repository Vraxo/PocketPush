<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2D2A2E">
  <meta name="description" content="Local Android-to-Windows file transfer.">
  <title>PocketPush</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" href="./fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./css/fonts.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/transfer.css">
  <link rel="stylesheet" href="./css/utilities.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="shell">
    <!-- Header and brand -->
    <header class="topbar">
      <a class="brand" href="./" aria-label="PocketPush home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 23V7m0 0-6 6m6-6 6 6M7 20v5.5A2.5 2.5 0 0 0 9.5 28h13a2.5 2.5 0 0 0 2.5-2.5V20" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">pocketpush<span class="brand-period">.</span></span>
          <span class="brand-caption">PHONE <span>→</span> PC</span>
        </span>
      </a>
    </header>

    <!-- Main workspace: sources, transfer, connection and options -->
    <div class="workspace">
      <div class="main-column">
        <section class="card sources-card" aria-labelledby="sources-heading">
          <div class="card-heading">
            <div class="heading-main">
              <div><h2 id="sources-heading">Folders</h2></div>
            </div>
            <span id="source-count" class="count-badge">0 folders</span>
          </div>

          <div id="source-list" class="source-list">
            <div class="empty-state" id="empty-sources">
              <span class="empty-folder" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none"><path d="M4 9.5A2.5 2.5 0 0 1 6.5 7H13l3 3h9.5A2.5 2.5 0 0 1 28 12.5v11a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 4 23.5v-14Z" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 13h23" stroke="currentColor" stroke-width="1.6"/></svg>
              </span>
              <strong>No folders yet</strong>
            </div>
          </div>

          <button id="add-folder" class="add-folder-button" type="button">
            <span class="add-icon" aria-hidden="true">＋</span>
            <span>Add folder</span>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
          </button>
        </section>

        <section id="review-panel" class="card review-panel hidden" aria-labelledby="review-heading">
          <div class="card-heading">
            <div class="heading-main">
              <div><h2 id="review-heading">Review</h2></div>
            </div>
            <span id="review-count" class="count-badge">0 selected</span>
          </div>
          <div class="review-toolbar">
            <div><button id="select-all" class="text-button" type="button">All</button><span class="toolbar-divider">/</span><button id="select-none" class="text-button" type="button">None</button></div>
          </div>
          <div id="file-list" class="file-list"></div>
        </section>

        <section class="send-panel" aria-label="Send files">
          <button id="send-all" class="send-button" type="button">
            <span class="send-button-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5m0 0L6.5 10.5M12 5l5.5 5.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 16.5v2A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5v-2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
            </span>
            <span class="send-button-copy"><strong id="send-label">SEND ALL</strong></span>
            <span class="send-button-arrow" aria-hidden="true">↗</span>
          </button>
        </section>

        <section id="transfer-panel" class="card transfer-panel hidden" aria-labelledby="transfer-heading" aria-live="polite">
          <div class="card-heading">
            <div class="heading-main">
              <div>
                <h2 id="transfer-heading">Transfer</h2>
                <p id="transfer-current" class="transfer-current">Preparing…</p>
              </div>
            </div>
            <span id="transfer-counter" class="count-badge">0 / 0</span>
          </div>
          <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
          <div class="transfer-metrics" aria-live="off">
            <span id="transfer-bytes">0 B / 0 B</span>
            <span id="transfer-speed">—</span>
            <span id="transfer-eta">— remaining</span>
          </div>
          <div id="transfer-results" class="transfer-results"></div>
          <button id="retry-failed" class="button button-outline button-wide hidden" type="button">Retry failed files</button>
        </section>
      </div>

      <aside class="side-column">
        <details id="connection-panel" class="card disclosure-card connection-panel" open>
          <summary class="disclosure-summary">
            <span class="summary-icon icon-cyan" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4" width="17" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 20h8m-4-4v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </span>
            
            <span id="connection-state" class="state-badge state-unknown">Not tested</span>
            <span class="chevron" aria-hidden="true">⌄</span>
          </summary>
          <div class="disclosure-content">
            <label class="field-label" for="server-url">ADDRESS</label>
            <input id="server-url" class="text-input" type="text" inputmode="decimal" autocomplete="off" placeholder="192.168.1.104" spellcheck="false" autocapitalize="off">
            <p class="field-hint">HTTPS · port 8765</p>
            <label class="field-label" for="receiver-token">KEY</label>
            <div class="token-row">
              <input id="receiver-token" class="text-input" type="password" autocomplete="off" placeholder="Paste the key from Windows" spellcheck="false">
              <button id="toggle-token" class="icon-button" type="button" aria-label="Show pairing key" title="Show pairing key">
                <svg viewBox="0 0 24 24" fill="none"><path d="M2.8 12s3.3-6 9.2-6 9.2 6 9.2 6-3.3 6-9.2 6-9.2-6-9.2-6Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg>
              </button>
            </div>
            <button id="test-connection" class="button button-secondary button-wide" type="button">Connect</button>
            <p id="connection-message" class="message" role="status">Enter the PC address and key.</p>
          </div>
        </details>

        <details id="options-panel" class="card disclosure-card options-panel">
          <summary class="disclosure-summary">
            <span class="summary-icon icon-purple" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M7 12h10m-7 5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="7" r="2" fill="#2D2A2E" stroke="currentColor" stroke-width="1.6"/><circle cx="15" cy="12" r="2" fill="#2D2A2E" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            
            <span class="chevron" aria-hidden="true">⌄</span>
          </summary>
          <div class="disclosure-content options-content">
            <label class="option-row">
              <span class="option-copy"><strong>Include subfolders</strong></span>
              <input id="include-subfolders" type="checkbox" checked>
              <span class="switch" aria-hidden="true"></span>
            </label>
            <div class="option-divider"></div>
            <label class="option-row">
              <span class="option-copy"><strong>Review before sending</strong></span>
              <input id="review-before-send" type="checkbox">
              <span class="switch" aria-hidden="true"></span>
            </label>
          </div>
        </details>

      </aside>
    </div>

    <!-- Project links and version -->
    <footer class="footer">
      <nav class="footer-links" aria-label="About PocketPush">
        <a href="https://github.com/Vraxo/PocketPush" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        <span>POCKETPUSH <i>·</i> <span id="app-version">v1.2.5</span></span>
      </nav>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
